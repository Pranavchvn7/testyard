name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax check front-end modules
        run: for f in server.js seo.js api/*.js public/js/*.js public/js/pages/*.js; do node --check "$f"; done
      - name: API tests
        run: npm test
      - name: Install Playwright for browser tests
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e
